name: Import guides DATAtourisme

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  import-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install asyncpg httpx python-dotenv
      - name: Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              dsn = os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1)
              conn = await asyncpg.connect(dsn)
              with open("backend/migration_v28.sql", encoding="utf-8") as f:
                  await conn.execute(f.read())
              await conn.close()
          asyncio.run(main())
          PY
      - name: Import DATAtourisme
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
        run: python backend/import_datatourisme_guides.py
