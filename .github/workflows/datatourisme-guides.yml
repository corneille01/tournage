name: Import guides DATAtourisme

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation (n'écrit rien en base)"
        type: boolean
        default: true

      avec_greeters:
        description: "Inclure les greeters bénévoles"
        type: boolean
        default: false

      france:
        description: "Toute la France au lieu de l'Occitanie"
        type: boolean
        default: false

  schedule:
    - cron: "17 3 * * 1"

jobs:
  import-guides:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg httpx python-dotenv shapely

      - name: Migration
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              dsn = os.environ["DATABASE_URL"].replace(
                  "postgres://",
                  "postgresql://",
                  1
              )

              conn = await asyncpg.connect(dsn)

              with open(
                  "backend/migration_v28.sql",
                  encoding="utf-8"
              ) as f:
                  await conn.execute(f.read())

              await conn.close()

          asyncio.run(main())
          PY

      - name: Import DATAtourisme
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
        run: |
          ARGS=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.avec_greeters }}" = "true" ] && ARGS="$ARGS --avec-greeters"
            [ "${{ inputs.france }}" = "true" ] && ARGS="$ARGS --france"
          fi

          echo "Arguments : $ARGS"

          python import_datatourisme_guides.py $ARGS
