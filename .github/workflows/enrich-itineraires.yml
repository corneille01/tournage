name: Précalcul distances piéton/voiture — Géoplateforme IGN

on:
  workflow_dispatch:
    inputs:
      lieu_id:
        description: "ID d'un seul lieu (laisser vide pour tout traiter)"
        required: false
        default: ""

      departement:
        description: "Département à traiter (choisis 'tous' pour tout traiter d'un coup)"
        required: true
        type: choice
        default: "tous"
        options:
          - tous
          - Ariège
          - Aude
          - Aveyron
          - Gard
          - Haute-Garonne
          - Gers
          - Hérault
          - Lot
          - Lozère
          - Hautes-Pyrénées
          - Pyrénées-Orientales
          - Tarn
          - Tarn-et-Garonne

  schedule:
    - cron: "0 4 * * 1"

jobs:
  precalcul:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install asyncpg httpx python-dotenv

      - name: Précalculer les distances IGN
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python enrich_itineraires.py

          elif [ -n "${{ github.event.inputs.lieu_id }}" ]; then
            python enrich_itineraires.py \
              --lieu-id "${{ github.event.inputs.lieu_id }}"

          elif [ "${{ github.event.inputs.departement }}" != "tous" ]; then
            python enrich_itineraires.py \
              --departement "${{ github.event.inputs.departement }}"

          else
            python enrich_itineraires.py
          fi
