name: Traductions titre/synopsis (TMDB)

on:
  workflow_dispatch:
    inputs:
      film_id:
        description: "ID d'un seul film (laisser vide pour tous)"
        required: false
        default: ""

jobs:
  traductions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install asyncpg httpx python-dotenv
      - name: Traduire titre/synopsis via TMDB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.film_id }}" ]; then
            python enrich_traductions_tmdb.py --film-id ${{ github.event.inputs.film_id }}
          else
            python enrich_traductions_tmdb.py
          fi
