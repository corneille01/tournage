name: Remplissage du cache Overpass (refuges, parking, gare, etc.)

# hébergement, restaurant, office_tourisme et activite sont retirés
# d'ici — repris par DATAtourisme (données officielles, plus
# complètes). Ce workflow ne traite plus que les catégories encore
# utiles via OSM (refuge, police, hôpital, gare, aéroport, aérodrome,
# arrêt de bus, parking, distributeur).
#
# Hebdomadaire (pas quotidien) : les données OSM ne changent pas
# d'un jour à l'autre, et d'ne pas martyriser le serveur Overpass
# public tous les jours pour rien.
#
# Départements traités en SÉQUENCE (un attend que le précédent soit
# fini) — pas en parallèle — pour ne jamais saturer Overpass d'un coup.
on:
  workflow_dispatch:
    inputs:
      lieu_id:
        description: "ID d'un seul lieu à tester (laisser vide sinon)"
        required: false
        default: ""
      departement:
        description: "Département à traiter (ignoré si lieu_id est renseigné)"
        required: true
        type: choice
        default: "tous"
        options:
          - tous
          - Ariège
          - Aude
          - Aveyron
          - Gard
          - Haute-Garonne
          - Gers
          - Hérault
          - Lot
          - Lozère
          - Hautes-Pyrénées
          - Pyrénées-Orientales
          - Tarn
          - Tarn-et-Garonne
  schedule:
    - cron: "0 2 * * 1" # chaque lundi à 2h du matin (UTC)

jobs:
  test-un-lieu:
    if: ${{ github.event.inputs.lieu_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg httpx python-dotenv
      - name: Remplir un seul lieu (test)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python refresh_cache.py --lieu-id ${{ github.event.inputs.lieu_id }}

  un-seul-departement:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lieu_id == '' && github.event.inputs.departement != 'tous' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg httpx python-dotenv
      - name: Remplir amenity_cache / amenity_stats — ${{ github.event.inputs.departement }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python refresh_cache.py --departement "${{ github.event.inputs.departement }}"

  tous-les-departements:
    # Se déclenche soit sur le cron hebdomadaire, soit manuellement
    # avec "tous" choisi.
    if: ${{ github.event_name == 'schedule' || (github.event.inputs.lieu_id == '' && github.event.inputs.departement == 'tous') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180 # marge par département, exécutés un par un
    strategy:
      fail-fast: false # un département qui échoue n'arrête pas les autres
      max-parallel: 1 # SÉQUENTIEL — un département attend la fin du précédent
      matrix:
        departement:
          - "Ariège"
          - "Aude"
          - "Aveyron"
          - "Gard"
          - "Haute-Garonne"
          - "Gers"
          - "Hérault"
          - "Lot"
          - "Lozère"
          - "Hautes-Pyrénées"
          - "Pyrénées-Orientales"
          - "Tarn"
          - "Tarn-et-Garonne"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg httpx python-dotenv
      - name: Remplir amenity_cache / amenity_stats — ${{ matrix.departement }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python refresh_cache.py --departement "${{ matrix.departement }}"
