name: Rafraîchissement hebdomadaire Wikidata

# Se déclenche tous les lundis à 6h UTC, ou manuellement (bouton "Run
# workflow"). Tourne sur les serveurs GitHub — contourne le pare-feu
# université qui bloque le port Postgres (5432) en sortie, et se
# connecte directement à Neon (Render/Neon → pas de restriction entre
# eux). Toujours en statut='brouillon' : rien ne se publie sans
# validation manuelle.
#
# Si de nouveaux films sont trouvés, enchaîne AUTOMATIQUEMENT sur :
# photos des lieux → traductions → anecdotes Wikipédia → export final
# — chacun attend la fin du précédent. Ces films restent en brouillon
# (pas publiés) pendant l'enrichissement : c'est un choix assumé pour
# gagner du temps, mais ça veut dire qu'on enrichit du contenu pas
# encore validé — vérifie toujours avant publication.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  ingestion:
    runs-on: ubuntu-latest
    outputs:
      nouveaux_films: ${{ steps.compter.outputs.nombre }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install httpx python-dotenv asyncpg

      - name: Lancer l'ingestion Wikidata directement vers Neon
        id: compter
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python wikidata_ingest.py | tee sortie_ingestion.log
          NB=$(grep -c "Film créé:" sortie_ingestion.log || true)
          echo "nombre=$NB" >> "$GITHUB_OUTPUT"
          echo "→ $NB nouveau(x) film(s) trouvé(s)"

  enrichir-photos-lieux:
    needs: ingestion
    if: ${{ needs.ingestion.outputs.nouveaux_films != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg httpx python-dotenv
      - name: Photos des nouveaux lieux (Wikimedia Commons)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # "lieux" uniquement ici — "commodites" n'aurait rien à
        # traiter, amenity_cache n'existe pas encore pour des lieux
        # tout juste découverts (ça vient du pipeline Overpass/
        # DATAtourisme, séparé, pas de celui-ci).
        run: python enrich_photos.py --cible lieux

  enrichir-traductions:
    needs: [ingestion, enrichir-photos-lieux]
    if: ${{ needs.ingestion.outputs.nouveaux_films != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg httpx python-dotenv
      - name: Traduire titre/synopsis via TMDB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python enrich_traductions_tmdb.py

  chercher-anecdotes:
    needs: [ingestion, enrichir-traductions]
    if: ${{ needs.ingestion.outputs.nouveaux_films != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg httpx python-dotenv
      - name: Récupérer les anecdotes depuis Wikipédia
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python wikipedia_anecdotes.py

  exporter-anecdotes:
    needs: [ingestion, chercher-anecdotes]
    if: ${{ needs.ingestion.outputs.nouveaux_films != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg python-dotenv
      - name: Exporter l'état final pour relecture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_films_pour_anecdotes.py
      - name: Publier le JSON en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: films-pour-anecdotes
          path: backend/films_pour_anecdotes.json
          retention-days: 7
