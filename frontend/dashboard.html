<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelify — Mon espace</title>
<link rel="stylesheet" href="/style.css">
<style>
body{min-height:100vh;background:#0f1115;color:#eee;font-family:Rajdhani,Arial,sans-serif}.pelify-dashboard{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.pd-top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.pd-top a{color:#eee;text-decoration:none}.pd-title h1{margin:0;font-size:2rem}.pd-title p{margin:4px 0;color:#9ca0aa}.pd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pd-card{padding:16px;border:1px solid #292c34;border-radius:14px;background:#17191e}.pd-card b{font-size:1.35rem;display:block}.pd-card span{color:#9ca0aa;font-size:.82rem}.pd-sections{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.pd-panel{padding:16px;border:1px solid #292c34;border-radius:14px;background:#17191e}.pd-panel h2{font-size:1rem;margin:0 0 12px}.pd-list{display:flex;flex-direction:column;gap:8px}.pd-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #292c34}.pd-row small{color:#9ca0aa}.pd-history{margin-top:14px}.pd-history article{padding:12px 0;border-bottom:1px solid #292c34}.pd-history strong{display:block}.pd-history small{display:block;color:#9ca0aa;margin-top:4px}.pd-empty{color:#9ca0aa;padding:15px 0}.pd-back{display:inline-block;padding:9px 12px;border:1px solid #343842;border-radius:9px}.pd-loading{color:#9ca0aa}@media(max-width:750px){.pd-grid{grid-template-columns:repeat(2,1fr)}.pd-sections{grid-template-columns:1fr}.pd-top{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<main class="pelify-dashboard">
<header class="pd-top"><div class="pd-title"><h1>👤 Mon espace Pelify</h1><p>Votre historique de parcours et vos habitudes de cinétourisme.</p></div><div><a class="pd-back" href="/">← Retour à la carte</a> <button class="pd-back" onclick="effacerHistorique()">Effacer l’historique</button></div></header>
<div id="pd-content"><p class="pd-loading">Chargement de votre espace…</p></div>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const dur=s=>{s=Number(s||0);const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h} h ${m} min`:`${m} min`};
const dist=m=>{m=Number(m||0);return m>=1000?`${(m/1000).toFixed(1)} km`:`${Math.round(m)} m`};
async function effacerHistorique(){if(!confirm("Effacer tous vos parcours enregistrés sur ce navigateur ?"))return;await fetch("/api/parcours/historique",{method:"DELETE",credentials:"include"});load()}
async function load(){const c=document.getElementById('pd-content');try{const r=await fetch('/api/parcours/dashboard',{credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.detail||'Erreur');const x=d.resume||{};const row=(a,keyLabel='occurrences')=>(a||[]).map(x=>`<div class="pd-row"><span>${esc(x.film||x.commune||x.cat||x.mode||x.budget_level||'')}</span><small>${esc(x[keyLabel]||0)}</small></div>`).join('')||'<div class="pd-empty">Pas encore de données.</div>';const hist=(d.recent||[]).map(x=>`<article><strong>${esc(x.titre||'Mon parcours')}</strong><small>${new Date(x.created_at).toLocaleString('fr-FR')} · ${x.nb_etapes||0} étape(s) · ${dist(x.distance_metres)} · ${dur(x.duree_totale_estimee_secondes)} · ${esc(x.budget_level||'')}</small></article>`).join('')||'<div class="pd-empty">Votre premier parcours apparaîtra ici après un calcul.</div>';c.innerHTML=`<section class="pd-grid"><div class="pd-card"><b>${x.parcours||0}</b><span>parcours calculés</span></div><div class="pd-card"><b>${x.etapes||0}</b><span>étapes parcourues</span></div><div class="pd-card"><b>${dist(x.distance_metres)}</b><span>distance cumulée</span></div><div class="pd-card"><b>${dur(x.duree_secondes)}</b><span>temps de déplacement</span></div></section><section class="pd-sections"><div class="pd-panel"><h2>🎬 Films / séries les plus présents</h2><div class="pd-list">${row(d.films,'occurrences')}</div></div><div class="pd-panel"><h2>📍 Territoires explorés</h2><div class="pd-list">${row(d.communes,'occurrences')}</div></div><div class="pd-panel"><h2>🚗 Vos modes de déplacement</h2><div class="pd-list">${row(d.modes,'occurrences')}</div></div><div class="pd-panel"><h2>💶 Vos profils budget</h2><div class="pd-list">${row(d.budgets,'occurrences')}</div></div></section><section class="pd-panel pd-history"><h2>🕘 Vos derniers parcours</h2>${hist}</section>`}catch(e){c.innerHTML=`<p class="pd-empty">Impossible de charger votre espace : ${esc(e.message)}</p>`}}
load();
</script></body></html>
