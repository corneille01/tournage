<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pelify — Lieux de tournage en Occitanie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Découvrez où ont été tournés vos films, séries et animés préférés en Occitanie, et tout ce qu'il faut pour visiter : hébergements, restaurants, offices de tourisme, transports."
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/vendor/markercluster/MarkerCluster.css" />
    <link
      rel="stylesheet"
      href="/vendor/markercluster/MarkerCluster.Default.css"
    />
  </head>
  <body>
    <div id="app">
      <!-- ═══ SIDEBAR GAUCHE : en-tête fixe + recherche + type + cartes ═══ -->
      <button id="btn-hamburger" aria-label="Ouvrir/fermer le menu">☰</button>
      <aside id="sidebar">
        <button id="btn-fermer-sidebar" aria-label="Fermer le menu">✕</button>
        <header id="sidebar-header">
          <h1>
            <a href="https://pelify.app" class="lien-pelify">Pelify</a>
            <span class="sous-nom">Lieux de tournage</span>
          </h1>
          <p class="sous-titre" data-i18n="sousTitre">
            Lieux de tournage en Occitanie
          </p>

          <input
            type="search"
            id="recherche-input"
            data-i18n="recherchePlaceholder"
            placeholder="Chercher un film, une série…"
          />

          <div id="filtres">
            <button class="filtre-btn active" data-type="" data-i18n="tout">
              Tout
            </button>
            <button class="filtre-btn" data-type="movie" data-i18n="films">
              Films
            </button>
            <button class="filtre-btn" data-type="tv" data-i18n="series">
              Séries
            </button>
            <button
              id="filtre-visites-toggle"
              class="filtre-btn filtre-independant"
              data-i18n="avecVisite"
            >
              🎟️ Avec visite guidée
            </button>
          </div>

          <a href="/analyse.html" id="stats-toggle"
            >📊
            <span data-i18n="analyseComplete"
              >Analyse territoriale complète</span
            ></a
          >

          <div class="liens-legaux">
            <a href="/mentions-legales.html">Mentions légales</a> ·
            <a href="/cgu.html">CGU</a>
          </div>
        </header>

        <div id="cartes-scroll">
          <div id="cartes-liste"><!-- rempli par app.js --></div>
          <div id="cartes-loading" class="hidden">Chargement…</div>
          <div id="cartes-vide" class="hidden">
            Aucun résultat pour ces filtres.
          </div>
        </div>
      </aside>

      <!-- ═══ CARTE (à droite) ═══ -->
      <main id="carte-zone">
        <!-- Filtres avancés, en barre horizontale au-dessus de la carte —
             le zoom Leaflet est déplacé à droite (voir app.js) pour ne
             plus se chevaucher avec cette barre. -->
        <div id="filtres-carte">
          <select id="filtre-annee">
            <option value="">Année</option>
          </select>
          <select id="filtre-departement">
            <option value="">Département</option>
          </select>
          <!-- Filtre commune désactivé temporairement : données Wikidata
               trop imprécises pour ce niveau de granularité (voir historique).
               À réactiver une fois une meilleure source trouvée.
          <select id="filtre-commune"><option value="">Commune</option></select>
          -->
          <select id="filtre-nationalite">
            <option value="">Nationalité</option>
          </select>
          <button id="filtre-notoriete" data-tri="titre">
            ⭐ <span data-i18n="plusConnus">Les plus connus</span>
          </button>
        </div>

        <button
          id="btn-recentrer"
          class="hidden"
          title="Revenir à la vue initiale"
        >
          ⟲ <span data-i18n="recentrer">Recentrer</span>
        </button>

        <div id="panneau-navigation" class="hidden">
          <div class="nav-instruction">—</div>
          <div class="nav-distance"></div>
          <button id="btn-arreter-navigation">✕ Arrêter la navigation</button>
        </div>

        <div id="calques-carte">
          <button id="btn-choroplethe" data-actif="false">
            🗺️ <span data-i18n="departements">Départements</span>
          </button>
          <button id="btn-chaleur" data-actif="false">
            🔥 <span data-i18n="carteChaleur">Carte de chaleur</span>
          </button>
        </div>

        <div id="map"></div>
      </main>
    </div>

    <!-- ═══ POPUP LIEU DE TOURNAGE ═══ -->
    <div id="popup-overlay" class="hidden">
      <div id="popup-lieu">
        <button id="popup-fermer" aria-label="Fermer">✕</button>
        <img id="popup-poster" src="" alt="" />
        <div id="popup-contenu">
          <h2 id="popup-titre"></h2>
          <p id="popup-meta"></p>
          <p id="popup-adresse"></p>

          <div id="popup-synopsis" class="scrollable"></div>
          <div id="popup-anecdote">
            <!-- rempli par app.js si disponible -->
          </div>

          <div class="carrousel-pub" id="carrousel-pub-1" data-carrousel-id="1">
            <button class="carrousel-fleche carrousel-gauche">‹</button>
            <div class="carrousel-contenu"></div>
            <button class="carrousel-fleche carrousel-droite">›</button>
          </div>

          <div id="popup-description-lieu">
            <!-- rempli par app.js si disponible -->
          </div>
          <div id="popup-plateformes">
            <!-- logos streaming, rempli par app.js -->
          </div>

          <div id="popup-photos-lieu">
            <!-- photo actuelle du lieu, si dispo -->
          </div>

          <p class="popup-intro-visite">
            Vous voulez visiter ce lieu ? Voici ce qu'il vous faut savoir :
          </p>

          <div id="popup-boutons">
            <!-- rempli dynamiquement avec icônes/couleurs par app.js, activité incluse -->
          </div>

          <div id="popup-resultats"><!-- rempli au clic sur un bouton --></div>

          <div id="popup-actions-globales">
            <button id="btn-trace">
              🎬
              <span data-i18n="surLesTraces">Sur les traces de ce film…</span>
            </button>
            <div id="resultat-trace"><!-- rempli au clic --></div>
            <div id="section-reservation" class="scrollable">
              <!-- rempli au clic sur 'Voir sur la carte' -->
            </div>
          </div>

          <div class="carrousel-pub" id="carrousel-pub-2" data-carrousel-id="2">
            <button class="carrousel-fleche carrousel-gauche">‹</button>
            <div class="carrousel-contenu"></div>
            <button class="carrousel-fleche carrousel-droite">›</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/markercluster/leaflet.markercluster.js"></script>
    <script src="/vendor/leaflet-heat/leaflet-heat.js"></script>
    <script src="/vendor/turf/turf.min.js"></script>
    <script src="/vendor/opening-hours/suncalc.js"></script>
    <script src="/vendor/opening-hours/i18next.js"></script>
    <script src="/vendor/opening-hours/opening_hours.js"></script>
    <script src="/vendor/svg-icons/pub-fallback.js"></script>
    <script src="/i18n.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
